<style>
:root{

  --t1:#EEF2FF;--t2:#7B8FAE;--t3:#3A4D66;
  --blue:#2563EB;--green:#16A34A;--red:#EF4444;
  --orange:#F97316;--yellow:#EAB308;--teal:#14B8A6;--pur:#7C3AED;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;overscroll-behavior:none}
.scroll::-webkit-scrollbar{display:none}
input,select{font-family:inherit;color:var(--t1);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;-webkit-appearance:none;user-select:text;-webkit-user-select:text}
input::placeholder{color:var(--t3)}
button{cursor:pointer;font-family:inherit;border:none;outline:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
button:active{opacity:.8;transform:scale(.98)}
::-webkit-scrollbar{display:none}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fd .22s ease}
.pop{animation:pop .25s ease}
.spin{animation:spin .7s linear infinite}
.fin-card{background:linear-gradient(135deg,#111B2E 0%,#0D1526 100%);border:1px solid #1E2D45;border-radius:16px}
.fin-glow-green{box-shadow:0 0 20px #10B98122}
</style>

function rcMileSecToStr(sec){if(!sec)return'—';const m=Math.floor(sec/60);const s=sec%60;return`${m}:${String(s).padStart(2,'0')}`;}
function rcStrToSec(str){
  if(!str)return null;
  const parts=String(str).split(':');if(parts.length!==2)return null;
  const m=parseInt(parts[0],10),s=parseInt(parts[1],10);
  if(isNaN(m)||isNaN(s))return null;
  return m*60+s;
}
function rcTierBonus(tiers,value){for(const t of tiers){if(value>=(t.days!==undefined?t.days:t.miles))return t.amt;}return 0;}

function rcWeekStats(d,weekKey){
  const stats={};
  RC_PEOPLE.forEach(p=>{stats[p.id]={laps:0,miles:0,base:0,prBonus:0,days:new Set()};});
  const weekLogs=d.logs.filter(l=>rcWeekKey(l.date)===weekKey);
  weekLogs.forEach(l=>{
    const s=stats[l.person];if(!s)return;
    s.laps+=l.laps;s.miles+=l.miles;s.base+=l.earned;s.prBonus+=(l.prBonus||0);
    s.days.add(rcDayKey(l.date));
  });
  const dayPeople={};
  weekLogs.forEach(l=>{
    const dk=rcDayKey(l.date);
    if(!dayPeople[dk])dayPeople[dk]=new Set();
    dayPeople[dk].add(l.person);
  });
  let familyDays=0;
  Object.values(dayPeople).forEach(set=>{if(RC_FAMILY_TRIO.every(id=>set.has(id)))familyDays++;});
  const familyBonusEach=familyDays*RC_FAMILY_BONUS;
  RC_PEOPLE.forEach(p=>{stats[p.id].familyBonus=RC_FAMILY_TRIO.includes(p.id)?familyBonusEach:0;});

  RC_PEOPLE.forEach(p=>{
    const s=stats[p.id];
    s.consistencyBonus=rcTierBonus(RC_CONSISTENCY_TIERS,s.days.size);
    s.distanceBonus=rcTierBonus(RC_DISTANCE_TIERS,s.miles);
  });

  const dadMissed=stats.dad.days.size<RC_DAD_MIN_DAYS;
  RC_PEOPLE.forEach(p=>{stats[p.id].dadMissBonus=(!p.isDad&&dadMissed)?RC_DAD_MISS_BONUS:0;});

  RC_PEOPLE.forEach(p=>{
    const s=stats[p.id];
    s.total=parseFloat((s.base+s.prBonus+s.consistencyBonus+s.distanceBonus+s.familyBonus+s.dadMissBonus).toFixed(2));
  });
  return{stats,dadMissed,familyDays};
}

function rcLogRun({person,laps,effort,mileTimeStr}){
  if(!laps||laps<=0)return null;
  const d=loadRC();
  const isIris=!!rcPerson(person)?.lapOnly;
  const miles=parseFloat((laps*RC_LAP_MILES).toFixed(2));
  const rate=isIris?0:(RC_EFFORTS.find(e=>e.id===effort)?.rate||0);
  const earned=parseFloat((isIris?laps*RC_IRIS_RATE:miles*rate).toFixed(2));
  let prBonus=0;
  const mileSec=rcStrToSec(mileTimeStr);
  if(mileSec&&miles>=1){
    const prev=d.pr[person];
    if(!prev||mileSec<prev.sec){
      d.pr[person]={sec:mileSec,date:now()};
      prBonus=RC_PR_BONUS;
    }
  }
  const entry={id:'rc'+Date.now().toString(36),person,date:now(),laps,effort:isIris?null:effort,miles,earned,prBonus,mileSec:mileSec||null};
  d.logs=[entry,...d.logs];
  saveRC(d);
  return entry;
}

// Marking a week paid deposits that week's earnings into the kid's Finance account;
// unmarking reverses the deposit so the books stay in sync either way.
function rcMarkPaid(person,weekKey){
  const d=loadRC();
  const key=`${person}_${weekKey}`;
  if(d.paid[key])return 0;
  const{stats}=rcWeekStats(d,weekKey);
  const amount=stats[person]?.total||0;
  d.paid[key]=true;
  saveRC(d);
  if(amount>0)creditKidAccount(person,amount);
  return amount;
}
function rcUnmarkPaid(person,weekKey){
  const d=loadRC();
  const key=`${person}_${weekKey}`;
  if(!d.paid[key])return;
  const{stats}=rcWeekStats(d,weekKey);
  const amount=stats[person]?.total||0;
  delete d.paid[key];
  saveRC(d);
  if(amount>0)creditKidAccount(person,-amount);
}

function daysLeft(item){
  if(!item.addedDate||!item.expDays)return null;
  return Math.ceil((new Date(item.addedDate).getTime()+item.expDays*86400000-Date.now())/86400000);
}
function itemStatus(item){
  if(item.qty<=0)return"empty";
  const d=daysLeft(item);
  if(d!==null&&d<=0)return"expired";
  if(d!==null&&d<=1)return"urgent";
  if(d!==null&&d<=3)return"expiring";
  if(item.qty<=item.crit&&item.crit>0)return"critical";
  if(item.qty<=item.low&&item.low>0)return"low";
  return"ok";
}

  const all=S.items.filter(i=>{const n=i.name.toLowerCase().trim();return n===resolved||n===key;});

}

  if(S.fit.runLaps===0){showToast('Log at least one lap first');return;}
  const miles=parseFloat((S.fit.runLaps*RUN_LAP_MILES).toFixed(2));
  const durationMin=S.fit.runStart?Math.max(1,Math.round((Date.now()-new Date(S.fit.runStart).getTime())/60000)):null;
  S.fit.fitLog=[{id:'f'+Date.now().toString(36),type:'run',date:now(),laps:S.fit.runLaps,miles,durationMin},...S.fit.fitLog];
  saveFit();
  S.fit.runLaps=0;S.fit.runStart=null;
  showToast('🏃 Run logged — '+miles+' mi');
}

function finDonutChart(bills,funds,surplus,total){
  const cx=90,cy=90,r=68,sw=20;
  const circ=2*Math.PI*r;
  const segs=[
    {v:Math.max(0,bills),  c:'#3B82F6'},
    {v:Math.max(0,funds),  c:'#F59E0B'},
    {v:Math.max(0,surplus),c:'#10B981'},
  ].filter(s=>s.v>0&&total>0);
  let cum=0;
  const paths=segs.map(s=>{
    const dash=(s.v/total)*circ;
    const offset=circ*0.25-cum;
    cum+=dash;
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}"
      stroke-dashoffset="${offset.toFixed(2)}" stroke-linecap="butt"/>`;
  });
  return`<svg width="180" height="180" viewBox="0 0 180 180">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1A2840" stroke-width="${sw}"/>
    ${paths.join('')}
  </svg>`;
}
function finBarChart(weeks,w=280,h=72){
  if(!weeks.length)return`<svg width="${w}" height="${h}"><text x="${w/2}" y="${h/2}" fill="#3A4D66" text-anchor="middle" font-size="12">Log weeks to see chart</text></svg>`;
  const show=weeks.slice(-12);
  const maxV=Math.max(...show.map(wk=>Math.abs(wk.net)),1);
  const bw=Math.floor(w/show.length)-3;
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${show.map((wk,i)=>{
      const bh=Math.max(3,Math.round((Math.abs(wk.net)/maxV)*(h-4)));
      const x=i*(bw+3);const y=h-bh;
      const c=finNetClr(wk.net,wk.total);
      return`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${c}" rx="3" opacity=".85">
        <animate attributeName="height" from="0" to="${bh}" dur=".4s" begin="${i*.04}s" fill="freeze"/>
        <animate attributeName="y" from="${h}" to="${y}" dur=".4s" begin="${i*.04}s" fill="freeze"/>
      </rect>`;
    }).join('')}
  </svg>`;
}

function rcBonusChips(s){
  const chips=[];
  if(s.consistencyBonus)chips.push(`🔥 Consistency +${fmt(s.consistencyBonus)}`);
  if(s.distanceBonus)chips.push(`📏 Distance +${fmt(s.distanceBonus)}`);
  if(s.familyBonus)chips.push(`👨‍👩‍👦 Family +${fmt(s.familyBonus)}`);
  if(s.prBonus)chips.push(`🏅 PR +${fmt(s.prBonus)}`);
  if(s.dadMissBonus)chips.push(`💸 Dad Miss +${fmt(s.dadMissBonus)}`);
  if(!chips.length)return'';
  return`<div style="display:flex;gap:6px;flex-wrap:wrap">${chips.map(c=>`<span style="font-size:10px;background:#111B2E;border:1px solid #1E2D45;border-radius:8px;padding:4px 8px;color:#94A3B8">${c}</span>`).join('')}</div>`;
}

  return`<div class="scroll fade" style="padding-top:10px">

        </div>

          <span style="font-size:12px;color:#4ADE80;font-weight:700">${fmt(l.earned+(l.prBonus||0))}${l.prBonus?' 🏅':''}</span>
          <button data-action="rc-del-log" data-id="${l.id}" style="font-size:11px;color:#EF4444">✕</button>

function fitnessClubPayout(){
  const d=loadRC();
  const weeks=[...new Set(d.logs.map(l=>rcWeekKey(l.date)))].sort().reverse();
  const kids=RC_PEOPLE.filter(p=>!p.isDad);
  if(weeks.length===0)return`<div class="scroll fade" style="padding-top:40px;text-align:center"><div style="font-size:13px;color:var(--t2)">No runs logged yet — log a run to start earning!</div></div>`;
  let totalOwed=0;
  weeks.forEach(wk=>{
    const{stats}=rcWeekStats(d,wk);
    kids.forEach(k=>{if(!d.paid[`${k.id}_${wk}`])totalOwed+=stats[k.id].total;});
  });
  const curWk=rcWeekKey(now());
  return`<div class="scroll fade" style="padding-top:10px">
    <div class="fin-card fin-glow-green" style="padding:18px;text-align:center;margin-bottom:18px">
      <div style="font-size:11px;color:#7B8FAE;font-weight:700;letter-spacing:.06em;margin-bottom:6px">TOTAL YOU OWE RIGHT NOW</div>
      <div style="font-size:34px;font-weight:900;color:#4ADE80">${fmt(totalOwed)}</div>
      <div style="font-size:11px;color:#4A5D7A;margin-top:4px">Paid out every Sunday evening</div>
    </div>
    ${weeks.map(wk=>{
      const{stats}=rcWeekStats(d,wk);
      const isCurrent=wk===curWk;
      const rows=kids.map(k=>{
        const s=stats[k.id];
        if(s.laps===0&&s.total<=0)return'';
        const paidKey=`${k.id}_${wk}`;
        const isPaid=!!d.paid[paidKey];
        return`<div class="fin-card" style="padding:13px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:13px;font-weight:700;color:#EEF2FF">${k.icon} ${k.name}</div>
            <div style="font-size:11px;color:#7B8FAE">${fmt(s.total)} owed</div>
          </div>
          ${isPaid?`<button data-action="rc-unmark-paid" data-person="${k.id}" data-week="${wk}" style="padding:9px 14px;background:#0F2A1A;color:#4ADE80;border:1px solid #166534;border-radius:10px;font-size:12px;font-weight:700">Paid ✓</button>`
            :`<button data-action="rc-mark-paid" data-person="${k.id}" data-week="${wk}" style="padding:9px 14px;background:#16A34A;color:#fff;border-radius:10px;font-size:12px;font-weight:700">Mark Paid</button>`}
        </div>`;
      }).join('');
      if(!rows)return'';
      return`<div style="margin-bottom:18px">
        <div style="font-size:11px;color:var(--t3);font-weight:700;letter-spacing:.06em;margin-bottom:8px">${rcWeekLabel(wk).toUpperCase()}${isCurrent?' · IN PROGRESS':''}</div>
        ${rows}
      </div>`;
    }).join('')}
  </div>`;
}

function rcModal(){
  const v=S.rcView;

  if(v.type==='log-run'){
    const data=v.data;

    const isIris=!!rcPerson(person)?.lapOnly;
    const laps=data.laps||0;

    const miles=(laps*RC_LAP_MILES).toFixed(2);

    return`<div ${OV}><div ${SH}>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px">
        ${RC_PEOPLE.map(pp=>`<button data-action="rc-pick-person" data-person="${pp.id}" style="padding:10px 4px;background:${person===pp.id?'#16A34A':'#111B2E'};border:1px solid ${person===pp.id?'#16A34A':'#1E2D45'};border-radius:12px;text-align:center">
          <div style="font-size:20px">${pp.icon}</div>
          <div style="font-size:11px;font-weight:700;color:${person===pp.id?'#fff':'#94A3B8'};margin-top:2px">${pp.name}</div>
        </button>`).join('')}
      </div>
      <label style="font-size:11px;color:#4A5D7A;display:block;margin-bottom:8px">LAPS COMPLETED</label>
      <div style="display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:6px">
        <button data-action="rc-lap-dec" style="width:44px;height:44px;border-radius:50%;background:#1C2D45;color:#EEF2FF;font-size:20px;font-weight:700">−</button>
        <div style="font-size:36px;font-weight:900;color:#EEF2FF;min-width:60px;text-align:center">${laps}</div>
        <button data-action="rc-lap-inc" style="width:44px;height:44px;border-radius:50%;background:#16A34A;color:#fff;font-size:20px;font-weight:700">+</button>
      </div>
      <div style="text-align:center;font-size:12px;color:#4A5D7A;margin-bottom:18px">${miles} mi</div>
      ${!isIris?`<label style="font-size:11px;color:#4A5D7A;display:block;margin-bottom:8px">EFFORT LEVEL</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px">
        ${RC_EFFORTS.map(ef=>`<button data-action="rc-pick-effort" data-effort="${ef.id}" style="padding:12px 4px;background:${effort===ef.id?'#2563EB':'#111B2E'};border:1px solid ${effort===ef.id?'#2563EB':'#1E2D45'};border-radius:12px;text-align:center">
          <div style="font-size:18px">${ef.icon}</div>
          <div style="font-size:11px;font-weight:700;color:${effort===ef.id?'#fff':'#94A3B8'};margin-top:2px">${ef.label}</div>
          <div style="font-size:9px;color:${effort===ef.id?'#BFDBFE':'#4A5D7A'}">$${ef.rate.toFixed(2)}/mi</div>
        </button>`).join('')}
      </div>`:`<div style="padding:10px 12px;background:#111B2E;border:1px solid #1E2D45;border-radius:10px;font-size:12px;color:#94A3B8;margin-bottom:18px">Iris earns $${RC_IRIS_RATE.toFixed(2)} per lap at any pace — no mile requirement 💛</div>`}

      <div style="padding:14px;background:#111B2E;border:1px solid #16A34A44;border-radius:12px;text-align:center;margin-bottom:20px">
        <span style="font-size:22px;font-weight:900;color:#4ADE80">${fmt(earnPreview)}</span><span style="font-size:11px;color:#4A5D7A;margin-left:8px">earned this run</span>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

    {icon:"🍽️",label:"What Can We Eat?",sub:"See meals ready right now",color:"#2563EB",ktab:"meals"},

  return`<div class="scroll fade" style="padding-top:4px">

function cookLogTimeAgo(d){
  const diff=(Date.now()-new Date(d))/3600000;
  if(diff<1)return"Just now";
  if(diff<24)return"Today";
  if(diff<48)return"Yesterday";
  if(diff<168)return Math.floor(diff/24)+" days ago";
  return new Date(d).toLocaleDateString();
}

// ── KITCHEN SHOP ──
function kitchenShopTab(){
  const needed={};
  let hasPlan=false;
  PLAN_DAYS.forEach(d=>{
    ["breakfast","lunch","dinner"].forEach(m=>{
      const rid=S.weekPlan[d][m];
      if(!rid)return;
      hasPlan=true;
      const recipe=S.recipes.find(r=>r.id===rid);
      if(!recipe)return;
      const mult=FAMILY_SIZE/(recipe.servings||1);
      recipe.ings.forEach(i=>{
        const f=resolveItem(i.n);
        const have=f?f.qty:0;
        const need=Math.max(0,parseFloat((i.q*mult-have).toFixed(2)));
        if(need>0){
          const k=(f?.name||i.n).toLowerCase();
          if(needed[k])needed[k].need=parseFloat((needed[k].need+need).toFixed(2));
          else needed[k]={name:f?.name||i.n,need,unit:i.u,price:f?.price||0,cat:shopCategory(f?.name||i.n,f?.cat)};
        }
      });
    });
  });
  if(!hasPlan)return`<div class="scroll fade" style="padding-top:8px">
    <div style="text-align:center;padding:60px 16px">
      <div style="font-size:48px;margin-bottom:12px">📅</div>
      <div style="font-size:16px;font-weight:700;color:#E8EEF8;margin-bottom:8px">No plan yet</div>
      <div style="font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.5">Plan your week's meals first,<br>then hit Generate Shopping List.</div>
      <button data-action="k-tab" data-ktab="plan" style="padding:12px 24px;background:#0D9488;color:#fff;border-radius:12px;font-size:14px;font-weight:700">📅 Go to Planner</button>
    </div>
  </div>`;
  const list=Object.values(needed).sort((a,b)=>a.name.localeCompare(b.name));
  const hasPrices=list.some(i=>i.price>0&&!S.shopBought[i.name]);
  const total=list.filter(i=>!S.shopBought[i.name]&&i.price>0).reduce((s,i)=>s+i.price,0);
  const catIcon={Proteins:"🥩",Produce:"🥦",Frozen:"🧊",["Pantry Staples"]:"🥫"};
  function itemRow(i){
    const bought=S.shopBought[i.name];
    return`<div data-action="toggle-bought" data-item="${esc(i.name)}" style="background:${bought?"#0F2A1A":"var(--card)"};border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;border:1px solid ${bought?"#166534":"var(--border)"};opacity:${bought?.6:1}">
      <div style="width:24px;height:24px;border-radius:6px;border:2px solid ${bought?"#22C55E":"var(--border)"};background:${bought?"#22C55E":"transparent"};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${bought?"<span style='color:#fff;font-size:14px;font-weight:700'>✓</span>":""}
      </div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px;color:#E8EEF8;text-decoration:${bought?"line-through":"none"}">${esc(i.name)}</div>
        <div style="font-size:11px;color:var(--t2)">Need ${i.need} ${esc(i.unit)}</div>
      </div>
      ${i.price>0?`<div style="font-weight:700;color:#22C55E;font-size:14px">$${i.price.toFixed(2)}</div>`:""}
    </div>`;
  }
  return`<div class="scroll fade" style="padding-top:8px">
    <div style="background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:10px;color:var(--t2);margin-bottom:2px">ITEMS TO BUY</div><div style="font-size:26px;font-weight:800;color:#3B82F6">${list.length}</div></div>
      ${hasPrices?`<div style="text-align:right"><div style="font-size:10px;color:var(--t2);margin-bottom:2px">EST. COST</div><div style="font-size:26px;font-weight:800;color:#22C55E">$${total.toFixed(2)}</div></div>`:""}
    </div>
    ${list.length===0?`<div style="text-align:center;padding:40px 0;color:var(--t2)">🎉 You have everything for this week!</div>`:
      SHOP_CAT_ORDER.map(secCat=>{
        const items=list.filter(i=>i.cat===secCat);
        if(!items.length)return"";
        return`<div style="margin-bottom:16px">
          <div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:8px;letter-spacing:.06em">${catIcon[secCat]} ${secCat.toUpperCase()}</div>
          ${items.map(itemRow).join("")}
        </div>`;
      }).join("")}
  </div>`;
}

function kitchenAlertsTab(){

function handleClick(e){
  const btn=e.target.closest('[data-action]');
  if(!btn||btn.dataset.action==='noop')return;
  const a=btn.dataset.action;

  // ── top nav ──
  if(a==='top-tab'){setState({topTab:btn.dataset.tab});return;}

  // ── missions ──
  if(a==='m-tab'){setState({mTab:btn.dataset.mtab,view:null});return;}
  if(a==='close-modal'){setState({view:null});return;}
  if(a==='open-allocate'){setState({view:{type:'allocate',data:{}}});return;}
  if(a==='open-log'){setState({view:{type:'log',data:{}}});return;}
  if(a==='sel-mission'){setState({view:{type:'log',data:{mid:btn.dataset.mid}}});return;}
  if(a==='toggle'){
    const mid=btn.dataset.mid;
    const key=todayKey();
    const day=getDay(key);
    if(day.locked)return;
    day[mid]=!day[mid];
    saveDay(key,day);
    render();
    if(day[mid])showToast(`${M.find(m=>m.id===mid)?.icon} ${M.find(m=>m.id===mid)?.name} ✓`);
    return;
  }
  if(a==='lock-day'){
    const key=todayKey();
    const day=getDay(key);
    day.locked=true;
    saveDay(key,day);
    const sc=score(day);
    const msg=sc===5?'🔥 Perfect day. All 5 missions.':sc>=4?`✓ Locked in — ${sc}/5. Strong day.`:`Locked in — ${sc}/5. Tomorrow.`;
    showToast(msg);
    return;
  }
  if(a==='save-income'){
    const income=parseFloat(document.getElementById('fin-income')?.value)||0;
    const fin=loadFinancial();fin.income=income;saveFinancial(fin);
    showToast('Income saved');
    return;
  }
  if(a==='confirm-allocate'){
    const amt=parseFloat(document.getElementById('alloc-amt')?.value)||0;
    if(amt<=0){showToast('Enter an amount first');return;}
    const pcts={sec:50,wlth:15,biz:15,car:10,exp:10};
    const fin=loadFinancial();
    if(!fin.buckets)fin.buckets={};
    if(!fin.transactions)fin.transactions=[];
    M.forEach(m=>{
      const split=amt*(pcts[m.id]||10)/100;
      if(!fin.buckets[m.id])fin.buckets[m.id]={balance:0};
      fin.buckets[m.id].balance=(fin.buckets[m.id].balance||0)+split;
      fin.transactions.push({id:Date.now()+m.id,date:new Date().toISOString(),missionId:m.id,type:'allocation',amount:split,note:'Paycheck'});
    });
    saveFinancial(fin);S.view=null;
    showToast(`✓ $${amt.toLocaleString()} allocated across 5 missions`);
    return;
  }
  if(a==='confirm-log'){
    const mid=S.view?.data?.mid;
    const amt=parseFloat(document.getElementById('log-amt')?.value)||0;
    const note=document.getElementById('log-note')?.value||'';
    if(!mid){showToast('Select a mission first');render();return;}
    if(amt<=0){showToast('Enter an amount');render();return;}
    const fin=loadFinancial();
    if(!fin.buckets)fin.buckets={};
    if(!fin.transactions)fin.transactions=[];
    if(!fin.buckets[mid])fin.buckets[mid]={balance:0};
    fin.buckets[mid].balance=(fin.buckets[mid].balance||0)-amt;
    fin.transactions.push({id:Date.now(),date:new Date().toISOString(),missionId:mid,type:'expense',amount:amt,note});
    saveFinancial(fin);S.view=null;
    showToast(`− $${amt.toFixed(2)} logged`);
    return;
  }

  // ── finance (Varen Finance) ──
  if(a==='fin-tab'){setState({finTab:btn.dataset.fintab,finView:null});return;}
  if(a==='fin-close-modal'){setState({finView:null});return;}
  if(a==='fin-open-income'){setState({finView:{type:'income'}});return;}
  if(a==='fin-open-add-goal'){setState({finView:{type:'add-goal',data:{}}});return;}
  if(a==='fin-open-add-account'){setState({finView:{type:'add-account'}});return;}
  if(a==='fin-log-payment'){setState({finView:{type:'log-payment',idx:parseInt(btn.dataset.idx)}});return;}
  if(a==='fin-update-balance'){setState({finView:{type:'update-balance',idx:parseInt(btn.dataset.idx)}});return;}
  if(a==='fin-link-goal'){setState({finView:{type:'link-goal',goalIdx:parseInt(btn.dataset.idx)}});return;}

  if(a==='fin-refresh'){
    setState({finRefreshing:true});
    setTimeout(()=>{setState({finRefreshing:false,finLastRefresh:new Date().toISOString()});showToast('Updated ✓');},900);
    return;
  }

  if(a==='fin-edit-goal'){
    const idx=parseInt(btn.dataset.idx);const d=loadVF();const g=d.goals[idx];
    setState({finView:{type:'add-goal',editIdx:idx,data:{name:g.name,total:g.total,weeks:g.weeks}}});
    return;
  }

  if(a==='fin-save-income'){
    const av=parseFloat(document.getElementById('fin-inc-a')?.value)||0;
    const lv=parseFloat(document.getElementById('fin-inc-l')?.value)||0;
    const d=loadVF();d.anthon=av;d.lexi=lv;saveVF(d);
    setState({finView:null});showToast('Income updated ✓');return;
  }

  if(a==='fin-log-week'){
    const d=loadVF();const key=finWeekKey();
    if(d.weeks.find(w=>w.key===key)){showToast('Already logged this week');return;}
    const total=d.anthon+d.lexi;
    const bills=d.bills.reduce((s,b)=>s+b.weekly,0);
    const funds=d.funds.reduce((s,f)=>s+f.weekly,0);
    d.weeks.push({key,weekLabel:finWeekLabel(),anthon:d.anthon,lexi:d.lexi,total,bills,funds,net:total-bills-funds,date:new Date().toISOString()});
    saveVF(d);showToast('Week logged ✓');return;
  }

  if(a==='fin-save-goal'){
    const name=(document.getElementById('fin-g-name')?.value||'').trim();
    const total=parseFloat(document.getElementById('fin-g-total')?.value)||0;
    const weeks=parseFloat(document.getElementById('fin-g-weeks')?.value)||0;
    if(!name){showToast('Enter a goal name');return;}
    if(total<=0){showToast('Enter the total cost');return;}
    if(weeks<=0){showToast('Enter target weeks');return;}
    const d=loadVF();
    const weekly=parseFloat((total/weeks).toFixed(2));
    if(S.finView.editIdx!=null){
      const g=d.goals[S.finView.editIdx];
      g.name=name;g.total=total;g.weeks=weeks;g.weekly=weekly;
    } else {
      d.goals.push({id:finUid(),name,total,weeks,weekly,saved:0,created:new Date().toISOString()});
    }
    const wasEditing=S.finView.editIdx!=null;
    saveVF(d);setState({finView:null});showToast(`${wasEditing?'Updated':'Added'} — ${finFmt(weekly)}/wk`);return;
  }

  if(a==='fin-del-goal'){
    const idx=parseInt(btn.dataset.idx);const d=loadVF();
    const name=d.goals[idx]?.name;d.goals.splice(idx,1);saveVF(d);showToast(`"${name}" removed`);return;
  }

  if(a==='fin-confirm-payment'){
    const amt=parseFloat(document.getElementById('fin-pay-amt')?.value)||0;
    if(amt<=0){showToast('Enter an amount');return;}
    const d=loadVF();const g=d.goals[S.finView.idx];
    if(!g){setState({finView:null});return;}
    g.saved=(g.saved||0)+amt;
    const linked=d.accounts.find(ac=>ac.goalId===g.id);
    if(linked)linked.balance=(linked.balance||0)+amt;
    saveVF(d);setState({finView:null});
    showToast(g.saved>=g.total?`🎉 "${g.name}" fully funded!`:`+${finFmt(amt)} logged`);return;
  }

  if(a==='fin-save-account'){
    const name=(document.getElementById('fin-acct-name')?.value||'').trim();
    const inst=(document.getElementById('fin-acct-inst')?.value||'').trim();
    const type=document.getElementById('fin-acct-type')?.value||'savings';
    const bal=parseFloat(document.getElementById('fin-acct-bal')?.value)||0;
    if(!name){showToast('Enter an account name');return;}
    const d=loadVF();
    d.accounts.push({id:finUid(),name,institution:inst,type,balance:bal,lastUpdated:new Date().toISOString()});
    saveVF(d);setState({finView:null});showToast(`${name} added ✓`);return;
  }

  if(a==='fin-del-account'){
    const idx=parseInt(btn.dataset.idx);const d=loadVF();
    const name=d.accounts[idx]?.name;d.accounts.splice(idx,1);saveVF(d);showToast(`"${name}" removed`);return;
  }

  if(a==='fin-confirm-balance'){
    const bal=parseFloat(document.getElementById('fin-bal-new')?.value);
    if(isNaN(bal)){showToast('Enter a balance');return;}
    const d=loadVF();d.accounts[S.finView.idx].balance=bal;
    d.accounts[S.finView.idx].lastUpdated=new Date().toISOString();
    saveVF(d);setState({finView:null});showToast('Balance updated ✓');return;
  }

  if(a==='fin-confirm-link'){
    const goalIdx=parseInt(btn.dataset.goal);
    const acctIdx=parseInt(btn.dataset.acct);
    const d=loadVF();
    const goalId=d.goals[goalIdx]?.id;
    d.accounts.forEach(ac=>{if(ac.goalId===goalId)delete ac.goalId;});
    d.accounts[acctIdx].goalId=goalId;
    saveVF(d);setState({finView:null});showToast('Account linked ✓');return;
  }

  if(a==='fin-unlink-goal'){
    const idx=parseInt(btn.dataset.idx);const d=loadVF();
    const goalId=d.goals[idx]?.id;
    d.accounts.forEach(ac=>{if(ac.goalId===goalId)delete ac.goalId;});
    saveVF(d);showToast('Account unlinked');return;
  }

  // ── fitness ──
  if(a==='f-tab'){setState({fTab:btn.dataset.ftab});return;}
  if(a==='yoga-start'){startYoga();return;}
  if(a==='yoga-pause'){pauseYoga();return;}
  if(a==='yoga-resume'){resumeYoga();return;}
  if(a==='yoga-skip'){skipYogaPose();return;}
  if(a==='yoga-stop'){stopYoga();return;}
  if(a==='strength-inc'){adjustStrengthSet(btn.dataset.ex,parseInt(btn.dataset.set),1);return;}
  if(a==='strength-dec'){adjustStrengthSet(btn.dataset.ex,parseInt(btn.dataset.set),-1);return;}
  if(a==='strength-log-set'){logStrengthSet(btn.dataset.ex,parseInt(btn.dataset.set));return;}
  if(a==='strength-finish'){finishStrengthWorkout();render();return;}
  if(a==='run-lap'){runLap();return;}
  if(a==='run-reset'){runReset();return;}
  if(a==='run-log'){runLog();render();return;}
  // ── running club ──
  if(a==='rc-tab'){setState({rcTab:btn.dataset.rctab});return;}
  if(a==='rc-open-log'){rcOpenLogModal();return;}
  if(a==='rc-close-modal'){setState({rcView:null});return;}
  if(a==='rc-pick-person'){
    S.rcView.data.person=btn.dataset.person;
    if(rcPerson(btn.dataset.person)?.lapOnly)S.rcView.data.effort=null;
    else if(!S.rcView.data.effort)S.rcView.data.effort='jog';
    render();return;
  }
  if(a==='rc-pick-effort'){S.rcView.data.effort=btn.dataset.effort;render();return;}
  if(a==='rc-lap-inc'){S.rcView.data.laps=(S.rcView.data.laps||0)+1;render();return;}
  if(a==='rc-lap-dec'){S.rcView.data.laps=Math.max(0,(S.rcView.data.laps||0)-1);render();return;}
  if(a==='rc-save-log'){rcSaveLog();render();return;}
  if(a==='rc-del-log'){rcDeleteLog(btn.dataset.id);render();return;}
  if(a==='rc-mark-paid'){
    const amount=rcMarkPaid(btn.dataset.person,btn.dataset.week);
    const p=rcPerson(btn.dataset.person);
    if(amount>0&&RC_KID_ACCOUNT[btn.dataset.person])showToast(`💰 $${amount.toFixed(2)} added to ${p.name}'s fund!`);
    render();return;
  }
  if(a==='rc-unmark-paid'){rcUnmarkPaid(btn.dataset.person,btn.dataset.week);render();return;}
  // ── kitchen ──
  if(a==='k-tab'){setState({kTab:btn.dataset.ktab});return;}
  if(a==='meal-tab'){setState({mealTab:btn.dataset.mtab2});return;}
  if(a==='pantry-loc'){setState({pantryLoc:btn.dataset.loc});return;}
  if(a==='inc'){
    const updated=S.items.map(i=>i.id===btn.dataset.id?{...i,qty:parseFloat((i.qty+1).toFixed(2)),addedDate:now()}:i);
    setState({items:updated});saveItems();
    return;
  }
  if(a==='dec'){
    const updated=S.items.map(i=>i.id===btn.dataset.id?{...i,qty:Math.max(0,parseFloat((i.qty-1).toFixed(2)))}:i);
    const item=updated.find(i=>i.id===btn.dataset.id);
    setState({items:updated});saveItems();
    if(item&&item.qty===0)showToast('📦 '+item.name+' is empty');
    return;
  }
  if(a==='start-cook'){
    const recipe=S.recipes.find(r=>r.id===btn.dataset.rid);
    if(!recipe)return;
    const ings=recipe.ings.map(i=>{const f=resolveItem(i.n);const have=f?f.qty:0;return{...i,have,ok:have>=i.q};});
    setState({cooking:{recipe,ings}});
    return;
  }
  if(a==='close-cook'){setState({cooking:null});return;}
  if(a==='confirm-cook'){
    const {recipe,ings}=S.cooking;
    let updated=[...S.items];
    ings.forEach(i=>{
      const f=resolveItem(i.n);
      if(f)updated=updated.map(p=>p.id===f.id?{...p,qty:Math.max(0,parseFloat((p.qty-i.q).toFixed(2)))}:p);
    });
    const logEntry={id:"l"+Date.now().toString(36),recipeId:recipe.id,recipeName:recipe.name,ings:recipe.ings,cookedAt:now()};
    const newLog=[logEntry,...S.cookLog];
    setState({items:updated,cooking:null,cookLog:newLog});
    saveCookLog();saveItems();
    showToast("🍳 Cooked "+recipe.name+"! Check Cook Log to undo.");
    return;
  }
  if(a==='toggle-bought'){
    const name=btn.dataset.item;
    const nb={...S.shopBought,[name]:!S.shopBought[name]};
    setState({shopBought:nb});
    return;
  }
  if(a==='meals-view'){setState({mealsView:btn.dataset.view});return;}
  if(a==='undo-meal'){
    const entry=S.cookLog.find(e=>e.id===btn.dataset.lid);
    if(entry)setState({undoMeal:entry});
    return;
  }
  if(a==='close-undo'){setState({undoMeal:null});return;}
  if(a==='confirm-undo'){
    const e=S.undoMeal;
    let updated=[...S.items];
    e.ings.forEach(i=>{
      const f=resolveItem(i.n);
      if(f)updated=updated.map(p=>p.id===f.id?{...p,qty:parseFloat((p.qty+i.q).toFixed(2))}:p);
    });
    const newLog=S.cookLog.filter(l=>l.id!==e.id);
    setState({items:updated,undoMeal:null,cookLog:newLog});
    saveCookLog();saveItems();
    showToast("↩ "+e.recipeName+" undone — pantry restored!");
    return;
  }
  if(a==='clear-plan'){S.weekPlan=emptyPlan();saveWeekPlan();render();return;}
  if(a==='goto-shop'){setState({kTab:"shop"});return;}
  if(a==='open-add-item'){
    setState({addItem:{name:"",qty:1,unit:"count",loc:"fridge",cat:"other",expDays:7,price:0,low:0}});
    return;
  }
  if(a==='close-add-item'){setState({addItem:null});return;}
  if(a==='ai-loc'){syncAddItemFromDOM();S.addItem.loc=btn.dataset.loc;render();return;}
  if(a==='ai-cat'){syncAddItemFromDOM();S.addItem.cat=btn.dataset.cat;render();return;}
  if(a==='save-item'){
    syncAddItemFromDOM();
    const f=S.addItem;
    if(!f.name.trim()){showToast("⚠️ Item name is required");return;}
    // BUGFIX: upsert by name instead of always creating a duplicate
    const trimmedName=f.name.trim();
    const existing=S.items.find(i=>i.name.toLowerCase()===trimmedName.toLowerCase());
    let updated;
    if(existing){
      updated=S.items.map(i=>i.id===existing.id?{...i,
        qty:parseFloat((i.qty+(parseFloat(f.qty)||0)).toFixed(2)),
        unit:f.unit.trim()||i.unit,
        loc:f.loc,cat:f.cat,
        expDays:parseInt(f.expDays)||i.expDays,
        price:parseFloat(f.price)||i.price,
        low:parseInt(f.low)||i.low,
        addedDate:now()
      }:i);
    } else {
      const newId="u"+Date.now().toString(36);
      const newItem=mkItem(newId,trimmedName,parseFloat(f.qty)||0,f.unit.trim()||"count",f.loc,f.cat,parseInt(f.expDays)||0,parseFloat(f.price)||0,parseInt(f.low)||0,0);
      updated=[...S.items,newItem];
    }
    setState({items:updated,addItem:null});
    saveItems();
    showToast((existing?"✅ Updated ":"✅ ")+trimmedName+(existing?" in pantry!":" added to pantry!"));
    return;
  }
  if(a==='open-add-meal'){
    setState({addMeal:{name:"",cat:"dinner",servings:4,gf:true,ings:[]}});
    return;
  }
  if(a==='close-add-meal'){setState({addMeal:null});return;}
  if(a==='am-cat'){syncAddMealFromDOM();S.addMeal.cat=btn.dataset.cat;render();return;}
  if(a==='am-gf'){syncAddMealFromDOM();S.addMeal.gf=!S.addMeal.gf;render();return;}
  if(a==='add-ing'){
    syncAddMealFromDOM();
    const ingName=(document.getElementById("am-ing-name")?.value||"").trim();
    const ingQty=parseFloat(document.getElementById("am-ing-qty")?.value)||1;
    let ingUnit=(document.getElementById("am-ing-unit")?.value||"").trim();
    if(!ingName){showToast("⚠️ Enter an ingredient name");return;}
    if(!ingUnit){
      const found=S.items.find(i=>i.name.toLowerCase()===ingName.toLowerCase());
      ingUnit=found?found.unit:"count";
    }
    S.addMeal.ings.push({n:ingName,q:ingQty,u:ingUnit});
    render();
    return;
  }
  if(a==='remove-ing'){
    syncAddMealFromDOM();
    S.addMeal.ings.splice(parseInt(btn.dataset.idx),1);
    render();
    return;
  }
  if(a==='save-meal'){
    syncAddMealFromDOM();
    const f=S.addMeal;
    if(!f.name.trim()){showToast("⚠️ Meal name is required");return;}
    if(!f.ings.length){showToast("⚠️ Add at least one ingredient");return;}
    const newId="r"+Date.now().toString(36);
    const newRecipe={id:newId,name:f.name.trim(),gf:f.gf,cat:f.cat,servings:parseInt(f.servings)||1,ings:f.ings};
    const updated=[...S.recipes,newRecipe];
    setState({recipes:updated,addMeal:null,mealTab:f.cat});
    saveRecipes();
    showToast("🍽️ "+f.name.trim()+" added to meals!");
    return;
  }
}
function attachInputEvents(){
  const si=document.querySelector("[data-action='pantry-search']");
  if(si){
    si.addEventListener("input",e=>{S.pantrySearch=e.target.value;render();});
    si.addEventListener("focus",e=>e.preventDefault());
  }
  document.querySelectorAll("[data-action='plan-select']").forEach(sel=>{
    sel.addEventListener("change",e=>{
      const {day,meal}=sel.dataset;
      S.weekPlan[day][meal]=e.target.value||null;
      saveWeekPlan();
    });
  });
  [["ai-name",v=>{if(S.addItem)S.addItem.name=v;}],
   ["ai-unit",v=>{if(S.addItem)S.addItem.unit=v;}],
   ["am-name",v=>{if(S.addMeal)S.addMeal.name=v;}]
  ].forEach(([id,fn])=>{const el=document.getElementById(id);if(el)el.addEventListener("input",e=>fn(e.target.value));});

  if(S.finView?.type==='add-goal'){
    const updateGoalPreview=()=>{
      const name=document.getElementById('fin-g-name')?.value||'';
      const t=parseFloat(document.getElementById('fin-g-total')?.value)||0;
      const w=parseFloat(document.getElementById('fin-g-weeks')?.value)||0;
      S.finView.data={...(S.finView.data||{}),name,total:t||S.finView.data?.total||0,weeks:w||S.finView.data?.weeks||0};
      const prev=document.getElementById('fin-g-preview');
      if(!prev)return;
      if(t>0&&w>0){
        const d=loadVF();
        const total=d.anthon+d.lexi;
        const bills=d.bills.reduce((s,b)=>s+b.weekly,0);
        const funds=d.funds.reduce((s,f)=>s+f.weekly,0);
        const surplus=total-bills-funds;
        const wkly=t/w;
        const share=surplus>0?wkly/surplus:0;
        const gc=share>=.40?'#EF4444':share>=.25?'#F59E0B':'#10B981';
        prev.style.borderColor=gc+'44';
        prev.innerHTML=`<span style="font-size:24px;font-weight:900;color:${gc}">${finFmt(wkly)}/wk</span><span style="font-size:11px;color:#4A5D7A;margin-left:10px">${(share*100).toFixed(0)}% of surplus</span>`;
      } else {
        prev.style.borderColor='#1E2D45';
        prev.innerHTML=`<span style="font-size:12px;color:#3A4D66">Enter cost + weeks to see required weekly amount</span>`;
      }
    };
    ["fin-g-name","fin-g-total","fin-g-weeks"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",updateGoalPreview);
    });
  }

  if(S.rcView?.type==='log-run'){
    const el=document.getElementById('rc-mile-time');
    if(el)el.addEventListener('input',e=>{if(S.rcView)S.rcView.data.mileTimeStr=e.target.value;});
  }
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
// BUGFIX: reseeding must never delete a meal the family already has —
// only add any of ours that are missing by name, keep everything else.
function mergeMissingRecipes(existing){
  const have=new Set(existing.map(r=>r.name.toLowerCase().trim()));
  const merged=existing.slice();
  [...OLD_RECIPES,...NEW_KITCHEN_RECIPES].forEach(r=>{
    const key=r.name.toLowerCase().trim();
    if(!have.has(key)){merged.push(r);have.add(key);}
  });
  return merged;
}
function init(){
  let items,recipes,plan,log,fitLog,seedV;
  try{items=JSON.parse(localStorage.getItem("fk-items"));}catch{}
  try{recipes=JSON.parse(localStorage.getItem("fk-recipes"));}catch{}
  try{plan=JSON.parse(localStorage.getItem("fk-plan"));}catch{}
  try{log=JSON.parse(localStorage.getItem("fk-log"));}catch{}
  try{fitLog=JSON.parse(localStorage.getItem("fk-fit"));}catch{}
  try{seedV=parseInt(localStorage.getItem("fk-seed-v"))||0;}catch{seedV=0;}
  const reseed=seedV<KITCHEN_SEED_VERSION;
  S.items=(items&&items.length>0&&!reseed)?items:DEFAULT_ITEMS;
  S.recipes=(recipes&&recipes.length>0)?(reseed?mergeMissingRecipes(recipes):recipes):DEFAULT_RECIPES;
  S.weekPlan=plan||emptyPlan();
  S.cookLog=log||[];
  S.fit.fitLog=fitLog||[];
  if(reseed){
    saveItems();saveRecipes();
    try{localStorage.setItem("fk-seed-v",String(KITCHEN_SEED_VERSION));}catch{}
  }else{
    if(!items||!items.length)saveItems();
    if(!recipes||!recipes.length)saveRecipes();
  }
  if(!plan)saveWeekPlan();
  render();
  document.getElementById("app").addEventListener("click",handleClick);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
